# S-MSDTv2 Phase 2: Stage B Spatio-Temporal Video Training
# Objective: Train TemporalDiff + Factorized Attention + EvidenceReadout on CLIP tokens
# Target: SOTA cross-dataset transfer (Celeb-DF v2 video AUC >= 0.95 - 0.965)

stage: stage_b
init_ckpt: outputs/checkpoints_v2_stage_a/best_ema.pt

model:
  backbone: openai/clip-vit-large-patch14
  tune: layernorm
  grad_ckpt: true
  dim: 384
  depth: 2
  heads: 6
  max_frames: 16
  grid: 16
  topk_frac: 0.05

data:
  store: data/store
  index: data/splits/index.csv
  frames_per_clip: 8         # T=8 contiguous frames
  frame_stride: 1
  crop_size: 224
  norm: clip                 # Uses CLIP_MEAN and CLIP_STD
  p_sbi: 0.0                 # 0.0 guarantees exact Option 2: 100% round-robin across all 3,600 FF++ fakes
  jpeg_quality: [50, 100]
  p_jpeg: 0.3
  p_blur: 0.1
  p_flip: 0.5
  val_k: 8                   # 8 clips per validation video (matching Phase 1)
  val_methods: ["Deepfakes", "Face2Face", "FaceSwap", "NeuralTextures", "FaceShifter"]  # Pure in-domain FF++ (excludes DFD)

train:
  epochs: 40
  batch_pairs: 8             # 16 clips per optimizer step
  grad_accum: 1
  lr_backbone_ln: 1.0e-5     # Low LR (0.1x) for LayerNorms during Stage B
  lr_head: 3.0e-4            # Temporal transformer blocks and readout head LR
  weight_decay: 0.05
  warmup_frac: 0.03
  min_lr_ratio: 0.01
  grad_clip: 1.0
  label_smoothing: 0.05
  lambda_mask: 0.5           # Active 16x16 patch-mask supervision
  ema_decay: 0.999
  precision: bfloat16
  num_workers: 4             # 4 parallel workers (stable memory footprint on Windows)
  pin_memory: true           # Fast async DMA transfers to 5090 VRAM
  persistent_workers: true   # Keeps workers hot in RAM between epochs (no restart latency)
  prefetch_factor: 2
  val_batch_size: 8          # 8 videos per validation batch
  val_workers: 4             # 4 parallel workers for fast & safe validation on Windows

output_dir: outputs/checkpoints_v2_fixed

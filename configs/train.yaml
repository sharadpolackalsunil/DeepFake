# Training configuration
optimizer: adamw
lr: 3.0e-4
backbone_lr: 3.0e-5
weight_decay: 0.05
betas: [0.9, 0.999]
schedule: cosine
warmup_steps: 2000
warmup_pct: 0.05
steps_per_epoch: 1000
total_steps: 50000
grad_clip: 1.0
label_smoothing: 0.05
epochs: 50
grad_accum: 4            # 8 micro-batch * 4 accum = 32 effective batch size
workers: 4               # 2-4 recommended on Windows to avoid process spawn memory thrashing
save_interval_steps: 500 # saves latest.pt every 500 steps for crash recovery

# Loss hyperparameters
loss_type: bce               # "bce" (recommended baseline floor) or "focal"
pos_weight: 0.25             # balances 1:4 real:fake ratio in FF++ (4 * 0.25 = 1.0)
alpha: 0.2                  # focal loss alpha (used if loss_type: focal)
gamma: 2.0                  # focal loss focusing parameter
lambda_contrastive: 0.0     # contrastive loss weight (set >0 during Phase 3 ablation)
lambda_align: 0.0           # cross-domain alignment loss weight (set >0 during Phase 3 ablation)
align_mode: decorrelate     # decorrelation/orthogonality between RGB and wavelet streams

# Optional features
use_wandb: false
compile: false              # torch.compile
gradient_checkpointing: false  # False on RTX 5090 (32GB VRAM fits all activations; ~25% faster)

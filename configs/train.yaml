# Training configuration
optimizer: adamw
lr: 3.0e-4
backbone_lr: 3.0e-5
weight_decay: 0.05
betas: [0.9, 0.999]
schedule: cosine
warmup_steps: 2000
warmup_pct: 0.05
steps_per_epoch: 1000
total_steps: 50000
grad_clip: 1.0
label_smoothing: 0.05
epochs: 50
grad_accum: 4            # 8 micro-batch * 4 accum = 32 effective batch size
workers: 8               # 8 workers on 24-core Intel Core Ultra 9 285K to prevent GPU starvation
val_workers: 8           # 8 workers during validation for parallel disk reads and decoding
val_batch_size: 32       # 32 chunks per batch for inference on 32GB RTX 5090 (no gradients needed)
max_val_batches: null    # null for full validation sweep, or integer (e.g. 200) for fast checks
save_interval_steps: 500 # saves latest.pt every 500 steps for crash recovery


# Loss hyperparameters
alpha: 0.2            # focal loss alpha (0.2 for balanced 1:4 real:fake ratio: 4*0.2 = 0.8 vs 1*0.8 = 0.8)
gamma: 2.0            # focal loss focusing parameter
lambda_contrastive: 0.1   # supervised contrastive loss weight
lambda_align: 0.05        # cross-domain alignment loss weight
align_mode: decorrelate   # decorrelation/orthogonality between RGB and wavelet streams

# Optional features
use_wandb: false
compile: false              # torch.compile
gradient_checkpointing: false  # False on RTX 5090 (32GB VRAM fits all activations; ~25% faster)

